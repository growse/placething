[package]
name = "placething"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["limit"] }
once_cell = "1"
